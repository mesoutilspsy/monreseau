<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAKARAS — Mon Réseau Médico-Social</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;height:100vh;display:flex;overflow:hidden;background:#faf7f2;color:#2c2825;}

/* NAV */
nav{width:180px;background:#fffef9;border-right:1px solid #e8e0d5;display:flex;flex-direction:column;flex-shrink:0;padding:12px 0;overflow-y:auto;}
.logo{padding:0 14px 16px;font-family:Georgia,serif;font-size:19px;font-weight:bold;}
.logo span{color:#c1607a;font-style:italic;}
.nav-group{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#aaa;padding:10px 14px 4px;}
.nav-btn{display:flex;align-items:center;gap:8px;padding:8px 14px;background:transparent;border:none;border-left:3px solid transparent;cursor:pointer;text-align:left;width:100%;transition:all .15s;}
.nav-btn:hover{background:#f5f1eb;}
.nav-btn.active{background:#f0ece6;border-left-color:#c1607a;}
.nav-btn .ico{font-size:17px;flex-shrink:0;}
.nav-btn .nav-title{font-size:12px;font-weight:600;color:#2c2825;}
.nav-footer{margin-top:auto;padding:10px 14px;font-size:9px;color:#aaa;border-top:1px solid #e8e0d5;}
.sync-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#5a9972;margin-right:3px;vertical-align:middle;}

/* MAIN */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{background:#fffef9;border-bottom:1px solid #e8e0d5;padding:7px 14px;display:flex;gap:7px;flex-wrap:wrap;align-items:center;flex-shrink:0;}
.search-wrap{position:relative;flex:1;max-width:260px;}
.search-wrap input{width:100%;padding:6px 12px 6px 30px;border:1.5px solid #e8e0d5;border-radius:50px;font-family:inherit;font-size:12px;background:#faf7f2;outline:none;color:#2c2825;}
.search-ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px;pointer-events:none;}
.chip{padding:4px 11px;border-radius:50px;border:1.5px solid #e8e0d5;background:#faf7f2;color:#2c2825;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;}
.chip.active{border-color:transparent;color:#fff;}
.chip-bool.active{background:#2c2825;border-color:#2c2825;}
.filter-select{padding:4px 10px;border-radius:50px;border:1.5px solid #e8e0d5;background:#faf7f2;font-family:inherit;font-size:11px;color:#2c2825;outline:none;cursor:pointer;}
.btn-reset{padding:4px 11px;border-radius:50px;border:1.5px solid #e8e0d5;background:transparent;font-family:inherit;font-size:11px;color:#7a7068;cursor:pointer;margin-left:auto;}
.count-badge{font-size:11px;color:#7a7068;white-space:nowrap;}
.count-badge strong{color:#2c2825;}
.body-wrap{flex:1;display:flex;overflow:hidden;}
.map-wrap{flex:1;position:relative;}
.map-el{width:100%;height:100%;}

/* SIDEBAR */
.sidebar{width:280px;background:#fffef9;border-left:1px solid #e8e0d5;display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;}
.sidebar-head{padding:9px 13px;border-bottom:1px solid #e8e0d5;font-size:11px;color:#7a7068;flex-shrink:0;}
.sidebar-list{flex:1;overflow-y:auto;}
.sidebar-list::-webkit-scrollbar{width:3px;}
.sidebar-list::-webkit-scrollbar-thumb{background:#e8e0d5;border-radius:2px;}
.card{padding:9px 13px;border-bottom:1px solid #e8e0d5;cursor:pointer;display:flex;gap:9px;align-items:flex-start;transition:background .12s;}
.card:hover{background:#f5f1eb;}
.card.active{background:#f0ece6;}
.card-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:4px;}
.card-type{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-bottom:1px;}
.card-name{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.card-ville{font-size:10px;color:#7a7068;margin-top:1px;}
.card-tags{display:flex;gap:3px;margin-top:3px;flex-wrap:wrap;}
.tag{font-size:9px;padding:1px 5px;border-radius:20px;font-weight:700;}
.empty{padding:40px 20px;text-align:center;color:#7a7068;}
.empty .emoji{font-size:28px;margin-bottom:8px;}

/* DETAIL PANEL */
.detail-panel{display:none;position:absolute;bottom:14px;left:14px;right:294px;background:#fffef9;border:1px solid #e8e0d5;border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.12);z-index:500;max-height:58%;overflow-y:auto;}
.detail-head{padding:12px 15px 10px;border-bottom:1px solid #e8e0d5;}
.detail-type{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-bottom:2px;}
.detail-name{font-family:Georgia,serif;font-size:17px;color:#2c2825;margin-bottom:2px;line-height:1.2;}
.detail-sub{font-size:11px;color:#7a7068;margin-top:1px;}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:10px 15px;}
.detail-field label{display:block;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:#7a7068;margin-bottom:2px;}
.detail-field p{font-size:12px;color:#2c2825;font-weight:500;}
.detail-field.full{grid-column:1/-1;}
.detail-pills{display:flex;gap:5px;padding:0 15px 9px;flex-wrap:wrap;}
.pill{font-size:10px;padding:2px 9px;border-radius:20px;font-weight:600;color:#fff;}
.detail-comment{padding:0 15px 10px;}
.detail-comment label{display:block;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:#7a7068;margin-bottom:3px;}
.detail-comment p{font-size:11px;color:#2c2825;line-height:1.5;}
.detail-actions{display:flex;gap:5px;padding:9px 15px 10px;flex-wrap:wrap;border-top:1px solid #e8e0d5;}
.action-btn{padding:5px 11px;border-radius:8px;border:1.5px solid #e8e0d5;background:#faf7f2;font-size:10px;font-weight:600;cursor:pointer;text-decoration:none;color:#2c2825;font-family:inherit;}
.action-btn:hover{background:#e8e0d5;}
.close-btn{position:absolute;top:10px;right:12px;background:none;border:none;font-size:17px;cursor:pointer;color:#7a7068;}

/* SECTION */
.section{display:none;flex:1;flex-direction:column;overflow:hidden;}
.section.active{display:flex;}

/* LEGEND */
.map-legend{background:#fffef9;border:1px solid #e8e0d5;border-radius:9px;padding:9px 11px;font-size:10px;line-height:1.9;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.legend-title{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7a7068;margin-bottom:5px;}
.legend-row{display:flex;align-items:center;gap:6px;}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}

/* ZONE SEARCH */
.zone-bar{position:absolute;top:11px;left:50%;transform:translateX(-50%);z-index:400;display:flex;filter:drop-shadow(0 2px 8px rgba(0,0,0,.12));}
.zone-input-wrap{position:relative;}
.zone-input-wrap input{width:260px;padding:8px 32px 8px 14px;border:2px solid #e8e0d5;border-right:none;border-radius:50px 0 0 50px;font-family:'DM Sans',sans-serif;font-size:12px;background:#fffef9;outline:none;color:#2c2825;}
.zone-input-wrap input:focus{border-color:#c1607a;}
.zone-clear{position:absolute;right:9px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:13px;cursor:pointer;color:#7a7068;display:none;}
.zone-btn{padding:8px 14px;background:#c1607a;border:2px solid #c1607a;border-radius:0 50px 50px 0;color:#fff;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;}
.zone-btn:hover{background:#a84e66;border-color:#a84e66;}
.zone-suggestions{position:absolute;top:calc(100% + 5px);left:0;right:0;background:#fffef9;border:1px solid #e8e0d5;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.1);overflow:hidden;display:none;z-index:600;}
.zone-suggestion{padding:7px 14px;font-size:12px;cursor:pointer;color:#2c2825;transition:background .1s;}
.zone-suggestion:hover{background:#f0ece6;}
.zone-marker-icon{background:#c1607a;border:3px solid #fff;border-radius:50%;width:16px;height:16px;box-shadow:0 2px 8px rgba(0,0,0,.3);animation:pulse 1.5s ease-in-out infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(193,96,122,.4);}50%{box-shadow:0 0 0 8px rgba(193,96,122,0);}}

/* LOADING */
#loading{position:fixed;inset:0;background:#faf7f2;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:12px;transition:opacity .4s;}
#loading.hidden{opacity:0;pointer-events:none;}
.spinner{width:34px;height:34px;border:3px solid #e8e0d5;border-top-color:#c1607a;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
#loading-text{font-size:13px;color:#7a7068;}
</style>
</head>

<div id="loading">
  <div style="font-family:Georgia,serif;font-size:22px;font-weight:bold">MAKA<span style="color:#c1607a;font-style:italic">RAS</span></div>

</div>

<nav>

  <button class="nav-btn" onclick="switchSection('hebergements',this)"><span class="ico">🏠</span><div class="nav-title">Hébergements</div></button>
  <button class="nav-btn" onclick="switchSection('samsah',this)"><span class="ico">🏡</span><div class="nav-title">SAMSAH / SAVS</div></button>
  <button class="nav-btn" onclick="switchSection('emplois',this)"><span class="ico">💼</span><div class="nav-title">Emplois (ESAT-EA)</div></button>

  <div class="nav-footer">
    <span class="sync-dot"></span>Synchro Google Sheets<br>
    <span id="last-update" style="font-size:9px;color:#bbb"></span>
  </div>
</nav>

  <!-- PSYCHIATRES -->

      <button class="btn-reset" onclick="resetSec('psy')">↺ Reset</button>
      <span class="count-badge"><strong id="psy-count">0</strong> praticiens</span>
    </div>
    <div class="body-wrap">

      <button class="chip chip-bool" id="plo-di"   onclick="toggleBool('plo-di',()=>renderSec('plo'))">🧩 DI</button>

      <div class="search-wrap"><span class="search-ico">🔍</span><input id="heb-search" placeholder="Nom ou ville…" oninput="renderSec('heb')"></div>
      <button class="chip active" style="background:#c1607a;border-color:transparent;color:#fff" data-htype="FAM" onclick="toggleHType(this)">FAM</button>

// ══════════════════════════════════════════
// CSV PARSER
// ══════════════════════════════════════════
function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = splitLine(lines[0]).map(h=>h.trim().replace(/^"|"$/g,''));
  return lines.slice(1).map(line=>{
    const vals = splitLine(line).map(v=>v.trim().replace(/^"|"$/g,''));
    const obj={}; headers.forEach((h,i)=>obj[h]=vals[i]||''); return obj;
  }).filter(r=>Object.values(r).some(v=>v.trim()));
}
function splitLine(line) {
  const res=[]; let cur=''; let inQ=false;
  for(let i=0;i<line.length;i++){
    if(line[i]==='"'){inQ=!inQ;}
    else if(line[i]===','&&!inQ){res.push(cur);cur='';}
    else cur+=line[i];
  }
  res.push(cur); return res;
}
function yes(v){ return v&&v.toLowerCase()==='oui'; }
function hasVal(v){ return v&&v.trim()&&v.toLowerCase()!=='nc'&&v.toLowerCase()!=='non'; }

function getCoords(r) {
  const lat = parseFloat(r['LAT']||r['Lat']||r['lat']||'');
  const lng = parseFloat(r['LNG']||r['Lng']||r['lng']||r['LON']||'');
  if(!isNaN(lat)&&!isNaN(lng)&&lat!==0&&lng!==0) return {lat,lng};
  return null;
}

// ══════════════════════════════════════════

      return parseCSV(await r.text());
    };

    const [rPsy,rMed,rIdl,rPlo,rEdu,rHeb,rEmp,rAso,rSam,rRea,rSan] = await Promise.all([
      fetchCSV('psy'), fetchCSV('med'), fetchCSV('idl'), fetchCSV('plo'), fetchCSV('edu'),

    ]);

    // PSYCHIATRES
    DATA.psy = rPsy.map(r=>{

        ville:r['Ville']||'', cp:r['Code postal']||'', dpt:String(r['Dpt']||r['4.0']||'').replace('.0',''),
        adresse:r['ADRESSE COMPLETE']||r['Adresse']||'',
        tel:r['Telephone']||'', mail:r['Mail']||'', site:r['Site']||'', visio:r['Visio ?']||'',

        commentaire:r['Commentaire']||'', lat:c.lat, lng:c.lng};

    // MÉDECINS SOMATIQUES
    DATA.med = rMed.map(r=>{
      const c=getCoords(r); if(!c) return null;
      return {nom:r['NOM']||'', type:r['TYPE']||'', spec:r['Spécialité / surspécialité']||'',
        ville:r['Ville']||'', cp:r['Code postal']||'', dpt:String(r['Dpt']||'').replace('.0',''),
        adresse:r['ADRESSE COMPLETE']||r['Adresse']||'',
        tel:r['Telephone']||'', mail:r['Mail']||'', site:r['Site']||'', visio:r['Visio ?']||'',

        adresse:r['ADRESSE COMPLETE']||r['Adresse']||'',

    // ÉDUC / PAIRES

        adresse:r['ADRESSE COMPLETE']||r['Adresse']||'',
        tel:r['Telephone']||'', mail:r['Mail']||'', site:r['Site']||'',

    }).filter(Boolean);

    // HÉBERGEMENTS
    DATA.heb = rHeb.map(r=>{
      const c=getCoords(r); if(!c) return null;

        ville:r['Ville']||'', cp:r['Code postal']||'', dpt:String(r['Dpt']||'').replace('.0',''),
        adresse:r['ADRESSE COMPLETE']||r['Adresse']||'',
        tel:r['Telephone']||'', mail:r['Mail']||'', site:r['Site']||'',
        population:r['Population']||'', tsa:yes(r['TSA/TED']),
        capacite:r['Capacité']||'', annee:r['Ouverture']||'',
        commentaire:r['Commentaire']||'', lat:c.lat, lng:c.lng};
    }).filter(Boolean);

    // ASSOCIATIF
    DATA.aso = rAso.map(r=>{
      const c=getCoords(r); if(!c) return null;
      return {nom:r['NOM']||'', type:r['TYPE']||'', domaine:r['Domaine / Pathologie']||'',
        ville:r['Ville']||'', cp:r['Code postal']||'', dpt:String(r['Dpt']||'').replace('.0',''),
        adresse:r['ADRESSE COMPLETE']||r['Adresse']||'',
        tel:r['Telephone']||'', mail:r['Mail']||'', site:r['Site']||'',
        annee:r['Année de création']||'', asso_gest:r['Association']||'',
        commentaire:r['Commentaire']||'', lat:c.lat, lng:c.lng};
    }).filter(Boolean);

    // SAMSAH / SAVS
    DATA.sam = rSam.map(r=>{
      const c=getCoords(r); if(!c) return null;
      return {nom:r['NOM']||'', type:r['TYPE']||'', asso:r['ASSO GEST']||'',
        ville:r['Ville']||'', cp:r['Code postal']||'', dpt:String(r['Dpt']||'').replace('.0',''),
        adresse:r['ADRESSE COMPLETE']||r['Adresse']||'',
        tel:r['Telephone']||'', mail:r['Mail']||'', site:r['Site']||'',
        population:r['Population']||'', tsa:hasVal(r['Spécifique TSA/TED']),
        capacite:r['Capacité']||'', age:r['Critère âge']||'', modalite:r['Modalité']||'',
        commentaire:r['Commentaire']||'', lat:c.lat, lng:c.lng};
    }).filter(Boolean);

    // RÉADAPTATION
    DATA.rea = rRea.map(r=>{
      const c=getCoords(r); if(!c) return null;
      return {nom:r['NOM']||'', type:r['TYPE']||'', orga:r['Organisme gestionnaire']||'',
        ville:r['Ville']||'', cp:r['Code postal']||'', dpt:String(r['Dpt']||'').replace('.0',''),
        adresse:r['ADRESSE COMPLETE']||r['Adresse']||'',
        tel:r['Telephone']||'', mail:r['Mail']||'', site:r['Site']||'',
        public_:r['Public']||'', tsa:hasVal(r['Spécifique TSA/TED']),
        prestations:r['Prestations']||'', commentaire:r['Commentaire']||'',
        lat:c.lat, lng:c.lng};
    }).filter(Boolean);

    // SANITAIRE
    DATA.san = rSan.map(r=>{
      const c=getCoords(r); if(!c) return null;
      return {nom:r['NOM']||'', type:r['TYPE']||'', spec:r['Spécialité / Intitulé']||'',
        rattach:r['Rattachement (CH / étab.)']||'',
        ville:r['Ville']||'', cp:r['Code postal']||'', dpt:String(r['Dpt']||'').replace('.0',''),
        adresse:r['ADRESSE COMPLETE']||r['Adresse']||'',
        tel:r['Telephone']||'', mail:r['Mail']||'', site:r['Site']||'',
        population:r['Population']||'', tsa:hasVal(r['Spécifique TSA/TED']),
        mobile:yes(r['Mobile ?']), territoire:r['Territoire couvert']||'',
        flyer:r['Flyer']||'', modalite:r['Modalité d\'accès']||'',
        commentaire:r['Commentaire']||'', lat:c.lat, lng:c.lng};
    }).filter(Boolean);

    // Fill dept selects
    const allSecs = ['psy','med','plo','idl','edu','heb','emp','aso','sam','rea','san'];
    allSecs.forEach(s => fillDept(s));

    // Init first map (psychiatres)
    initMap('psy');
    renderSec('psy');

    document.getElementById('last-update').textContent = new Date().toLocaleTimeString('fr-FR');
    document.getElementById('loading').classList.add('hidden');

  } catch(err) {
    document.getElementById('loading-text').innerHTML = '⚠️ '+err.message;
    console.error(err);
  }
}

function fillDept(s) {
  const sel = document.getElementById(s+'-dept');
  if(!sel) return;
  const depts = [...new Set((DATA[s]||[]).map(e=>e.dpt).filter(Boolean))].sort();
  depts.forEach(d=>{ const o=document.createElement('option'); o.value=d; o.textContent='Dép. '+d; sel.appendChild(o); });
}

// ══════════════════════════════════════════
// MAP UTILS
// ══════════════════════════════════════════
function makeIcon(fill, dark) {
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="32" viewBox="0 0 24 32"><path d="M12 0C5.37 0 0 5.37 0 12c0 8.2 12 20 12 20S24 20.2 24 12C24 5.37 18.63 0 12 0z" fill="'+fill+'" stroke="'+dark+'" stroke-width="2"/><circle cx="12" cy="12" r="4.5" fill="'+dark+'"/></svg>';
  return L.divIcon({html:svg, className:'', iconSize:[24,32], iconAnchor:[12,32], popupAnchor:[0,-32]});
}

function addLegend(map, items) {
  const ctrl = L.control({position:'bottomright'});
  ctrl.onAdd = () => {
    const d = L.DomUtil.create('div','map-legend');
    d.innerHTML = '<div class="legend-title">Légende</div>' +
      items.map(([l,f,dk])=>'<div class="legend-row"><div class="legend-dot" style="background:'+f+';border:2px solid '+dk+'"></div>'+l+'</div>').join('');
    return d;
  };
  ctrl.addTo(map);
}

function getColor(sec, item) {
  if(sec==='heb') return COLORS.heb[item.type] || {fill:'#ccc',dark:'#888'};
  if(sec==='aso') return COLORS.aso[item.type] || {fill:'#ccc',dark:'#888'};
  if(sec==='edu') return item.type==='Pair Aidance' ? COLORS.edu_pair : COLORS.edu_educ;
  return COLORS[sec] || {fill:'#ccc',dark:'#888'};
}

function initMap(s) {
  if(INITED[s]) return;
  INITED[s] = true;
  MARKERS[s] = {};
  const m = L.map('map-'+s, {zoomControl:true}).setView(DEFAULT_VIEW.center, DEFAULT_VIEW.zoom);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'© OpenStreetMap © CARTO',maxZoom:19}).addTo(m);
  MAPS[s] = m;

  // Legend
  if(s==='heb') addLegend(m, Object.entries(COLORS.heb).map(([k,v])=>[k,v.fill,v.dark]));
  else if(s==='aso') addLegend(m, Object.entries(COLORS.aso).map(([k,v])=>[k,v.fill,v.dark]));
  else if(s==='edu') addLegend(m, [['Éducateur',COLORS.edu_educ.fill,COLORS.edu_educ.dark],['Pair Aidant',COLORS.edu_pair.fill,COLORS.edu_pair.dark]]);
  else { const c=COLORS[s]||{fill:'#ccc',dark:'#888'}; addLegend(m, [[s,c.fill,c.dark]]); }

  // Markers
  (DATA[s]||[]).forEach((e,i) => {
    const c = getColor(s, e);
    const mk = L.marker([e.lat,e.lng],{icon:makeIcon(c.fill,c.dark)}).addTo(m);
    mk.on('click',()=>selectItem(s,i));
    MARKERS[s][i] = mk;
  });
}

// ══════════════════════════════════════════
// NAV
// ══════════════════════════════════════════
const SEC_MAP = {psychiatres:'psy',medecins:'med',psychologues:'plo',idel:'idl',educ:'edu',hebergements:'heb',samsah:'sam',emplois:'emp',readaptation:'rea',sanitaire:'san',associatif:'aso'};

function switchSection(id, btn) {
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('sec-'+id).classList.add('active');
  btn.classList.add('active');
  const s = SEC_MAP[id];
  setTimeout(()=>{ initMap(s); MAPS[s]&&MAPS[s].invalidateSize(); renderSec(s); },50);
}

// ══════════════════════════════════════════
// FILTRES
// ══════════════════════════════════════════
function toggleBool(id, cb) {
  const btn=document.getElementById(id);
  const a=btn.dataset.active!=='true';
  btn.dataset.active=a; btn.classList.toggle('active',a);
  if(a&&!btn.style.background) btn.style.cssText='background:#2c2825;border-color:#2c2825;color:#fff';
  else if(!a) btn.style.cssText='';
  cb();
}
function getBool(id){ return document.getElementById(id)?.dataset.active==='true'; }
function getSearch(s){ return (document.getElementById(s+'-search')?.value||'').toLowerCase(); }
function getDept(s){ return document.getElementById(s+'-dept')?.value||''; }

function resetSec(s) {
  const input=document.getElementById(s+'-search'); if(input) input.value='';
  const dept=document.getElementById(s+'-dept'); if(dept) dept.value='';
  document.querySelectorAll('[id^="'+s+'-"]').forEach(el=>{
    if(el.classList.contains('chip-bool')&&el.id!==s+'-dept'&&el.id!==s+'-search'){
      // Keep aso type buttons active
      if(s==='aso') { el.dataset.active='true'; el.classList.add('active'); }
      else { el.dataset.active='false'; el.classList.remove('active'); el.style.cssText=''; }
    }
  });
  const det=document.getElementById('detail-'+s); if(det) det.style.display='none';
  renderSec(s);
}

// Type filter for hebergements
function toggleHType(btn) {
  const t=btn.dataset.htype;
  btn.classList.toggle('active');
  if(HTYPES.has(t)) HTYPES.delete(t); else HTYPES.add(t);
  renderSec('heb');
}

// ══════════════════════════════════════════
// RENDER GÉNÉRIQUE
// ══════════════════════════════════════════
function filterData(s) {
  const q=getSearch(s), dept=getDept(s);
  return (DATA[s]||[]).filter(e => {
    if(dept&&e.dpt!==dept) return false;
    if(q&&!e.nom.toLowerCase().includes(q)&&!e.ville.toLowerCase().includes(q)) return false;
    // Section-specific filters
    if(s==='psy'){ if(getBool('psy-tsa')&&!e.tsa) return false; if(getBool('psy-tdah')&&!e.tdah) return false; if(getBool('psy-di')&&!e.di) return false; if(getBool('psy-tca')&&!e.tca) return false; if(getBool('psy-sexo')&&!e.sexo) return false; if(getBool('psy-dpl')&&!e.dpl) return false; if(getBool('psy-m37')&&!e.m37) return false; if(getBool('psy-visio')&&(e.visio||'').toLowerCase()!=='oui') return false; }
    if(s==='med'){ if(getBool('med-tsa')&&!e.tsa) return false; if(getBool('med-tdah')&&!e.tdah) return false; if(getBool('med-visio')&&(e.visio||'').toLowerCase()!=='oui') return false; }
    if(s==='plo'){ if(getBool('plo-di')&&!e.di) return false; if(getBool('plo-tdah')&&!e.tdah) return false; if(getBool('plo-hpi')&&!e.hpi) return false; if(getBool('plo-tca')&&!e.tca) return false; if(getBool('plo-sexo')&&!e.sexo) return false; if(getBool('plo-hab')&&!e.hab) return false; if(getBool('plo-m37')&&!e.m37) return false; if(getBool('plo-visio')&&(e.visio||'').toLowerCase()!=='oui') return false; }
    if(s==='edu'){ if(getBool('edu-tdah')&&!e.tdah) return false; if(getBool('edu-hpi')&&!e.hpi) return false; if(getBool('edu-di')&&!e.di) return false; if(getBool('edu-hab')&&!e.hab) return false; if(getBool('edu-visio')&&(e.visio||'').toLowerCase()!=='oui') return false; if(getBool('edu-grp')&&(e.groupes||'').toLowerCase()!=='oui') return false; }
    if(s==='heb'){ if(!HTYPES.has(e.type)) return false; if(getBool('heb-tsa')&&!hasVal(e.tsa)) return false; if(getBool('heb-snoe')&&(e.snoezelen||'').toLowerCase()!=='oui') return false; }
    if(s==='sam'){ if(getBool('sam-tsa')&&!e.tsa) return false; }
    if(s==='emp'){ if(getBool('emp-tsa')&&!e.tsa) return false; }
    if(s==='rea'){ if(getBool('rea-tsa')&&!e.tsa) return false; }
    if(s==='san'){ if(getBool('san-tsa')&&!e.tsa) return false; if(getBool('san-mob')&&!e.mobile) return false; }
    if(s==='aso'){
      const showGem=getBool('aso-gem'), showAl=getBool('aso-al'), showCafe=getBool('aso-cafe');
      const t=(e.type||'').trim();
      if(t==='GEM'&&!showGem) return false;
      if(t==='Asso locale'&&!showAl) return false;
      if(t==='Aspéro Café'&&!showCafe) return false;
    }
    return true;
  });
}

function renderSec(s) {
  const vis = filterData(s).sort((a,b)=>a.nom.localeCompare(b.nom,'fr'));
  const visSet = new Set(vis.map(e=>(DATA[s]||[]).indexOf(e)));
  const countEl = document.getElementById(s+'-count'); if(countEl) countEl.textContent=vis.length;

  if(MAPS[s]) {
    Object.entries(MARKERS[s]||{}).forEach(([i,mk])=>{
      visSet.has(Number(i))?(MAPS[s].hasLayer(mk)||mk.addTo(MAPS[s])):(MAPS[s].hasLayer(mk)&&MAPS[s].removeLayer(mk));
    });
  }

  const headEl=document.getElementById(s+'-head');
  if(headEl) headEl.textContent=vis.length+' résultat'+(vis.length!==1?'s':'');

  const listEl=document.getElementById(s+'-list');
  if(!listEl) return;
  if(!vis.length){ listEl.innerHTML='<div class="empty"><div class="emoji">🔍</div><p>Aucun résultat</p></div>'; return; }

  listEl.innerHTML = vis.map(e=>{
    const i=(DATA[s]||[]).indexOf(e);
    const c=getColor(s,e);
    const tags=buildTags(s,e,c);
    const subtitle = e.type&&e.genre?e.type+' · '+e.genre : e.type||e.spec||e.orient||'';
    return '<div class="card'+(SEL[s]===i?' active':'')+'" onclick="selectItem(\''+s+'\','+i+')" id="card-'+s+'-'+i+'">'
      +'<div class="card-dot" style="background:'+c.fill+';border:2px solid '+c.dark+'"></div>'
      +'<div style="flex:1;min-width:0">'
      +(subtitle?'<div class="card-type" style="color:'+c.dark+'">'+subtitle+'</div>':'')
      +'<div class="card-name">'+e.nom+'</div>'
      +'<div class="card-ville">📍 '+e.ville+(e.dpt?' · dép. '+e.dpt:'')+'</div>'
      +(tags.length?'<div class="card-tags">'+tags.join('')+'</div>':'')
      +'</div></div>';
  }).join('');
}

function buildTags(s,e,c) {
  const tags=[];
  const tag=(label,bg,col)=>'<span class="tag" style="background:'+bg+';color:'+col+'">'+label+'</span>';
  if(s==='psy'||s==='med'){ if(e.tsa)tags.push(tag('TSA','#b8d8f0','#2e7fc1')); if(e.tdah)tags.push(tag('TDAH','#fde8c8','#c87e3a')); if(e.dpl)tags.push(tag('DPL','#d0e8f7','#2e7fc1')); if(e.m37)tags.push(tag('M37','#d8eac8','#5a7a3a')); if(e.visio&&e.visio.toLowerCase()==='oui')tags.push(tag('Visio','#e8f4e8','#3a7a3a')); }
  if(s==='plo'){ if(e.tdah)tags.push(tag('TDAH','#fde8c8','#c87e3a')); if(e.hpi)tags.push(tag('HPI','#fff3b0','#8a6a00')); if(e.tca)tags.push(tag('TCA','#fce4ec','#c1607a')); if(e.hab)tags.push(tag('Hab.Soc.','#e8f4e8','#3a7a3a')); if(e.visio&&e.visio.toLowerCase()==='oui')tags.push(tag('Visio','#e8f4e8','#3a7a3a')); }
  if(s==='edu'){ if(e.tdah)tags.push(tag('TDAH','#fde8c8','#c87e3a')); if(e.di)tags.push(tag('DI','#d4b8f0','#7c3fc1')); if(e.hab)tags.push(tag('Hab.Soc.','#e8f4e8','#3a7a3a')); if(e.groupes&&e.groupes.toLowerCase()==='oui')tags.push(tag('Groupes','#f0e8d8','#8a5a2e')); if(e.visio&&e.visio.toLowerCase()==='oui')tags.push(tag('Visio','#e8f4e8','#3a7a3a')); }
  if(s==='heb'){ if(hasVal(e.tsa))tags.push(tag('TSA','#fce4ec','#c1607a')); if(e.snoezelen&&e.snoezelen.toLowerCase()==='oui')tags.push(tag('Snoezelen','#ede7f6','#7a5aa8')); }
  if(s==='sam'||s==='rea'||s==='emp'){ if(e.tsa)tags.push(tag('TSA','#fce4ec','#c1607a')); }
  if(s==='san'){ if(e.tsa)tags.push(tag('TSA','#fce4ec','#c1607a')); if(e.mobile)tags.push(tag('Mobile','#e8f4e8','#3a7a3a')); }
  return tags;
}

// ══════════════════════════════════════════
// SELECT ITEM — fiche détail
// ══════════════════════════════════════════
function navBtn(adresse, lat, lng) {
  const dest = encodeURIComponent(adresse||(lat+','+lng));
  return '<a class="action-btn" href="https://www.google.com/maps/dir/?api=1&destination='+dest+'" target="_blank" style="background:#e8f4e8;border-color:#5a9972;color:#2a6a3a;">🧭 Itinéraire</a>';
}

function selectItem(s, i) {
  SEL[s]=i;
  const e=(DATA[s]||[])[i];
  if(!e) return;
  const c=getColor(s,e);
  if(MAPS[s]) MAPS[s].flyTo([e.lat,e.lng],13,{duration:.8});

  document.querySelectorAll('#'+s+'-list .card').forEach(x=>x.classList.remove('active'));
  const card=document.getElementById('card-'+s+'-'+i);
  if(card){card.classList.add('active');card.scrollIntoView({behavior:'smooth',block:'nearest'});}

  const pills=buildPills(s,e,c);
  const actions=[];
  actions.push(navBtn(e.adresse||e.ville, e.lat, e.lng));
  if(e.tel)actions.push('<a class="action-btn" href="tel:'+e.tel+'">📞 '+e.tel+'</a>');
  if(e.mail)actions.push('<a class="action-btn" href="mailto:'+e.mail+'">✉️ Mail</a>');
  if(e.site)actions.push('<a class="action-btn" href="'+e.site+'" target="_blank">🌐 Site</a>');
  if(e.flyer)actions.push('<a class="action-btn" href="'+e.flyer+'" target="_blank">📄 Flyer</a>');

  const subtitle = buildSubtitle(s,e);
  const gridRows = buildGrid(s,e);

  const det=document.getElementById('detail-'+s);
  det.style.display='block';
  det.innerHTML='<button class="close-btn" onclick="document.getElementById(\'detail-'+s+'\').style.display=\'none\'">✕</button>'
    +'<div class="detail-head" style="border-top:4px solid '+c.dark+'">'
    +'<div class="detail-type" style="color:'+c.dark+'">'+subtitle+'</div>'
    +'<div class="detail-name">'+e.nom+'</div>'
    +(e.asso||e.asso_gest||e.orga||e.rattach?'<div class="detail-sub">'+(e.asso||e.asso_gest||e.orga||e.rattach)+'</div>':'')
    +'<div class="detail-sub">📍 '+e.ville+(e.cp?' ('+e.cp+')':'')+(e.dpt?' — Dép. '+e.dpt:'')+'</div>'
    +'</div>'
    +'<div class="detail-grid">'+gridRows+'</div>'
    +(pills.length?'<div class="detail-pills">'+pills.join('')+'</div>':'')
    +(e.commentaire?'<div class="detail-comment"><label>Note</label><p>'+e.commentaire+'</p></div>':'')
    +(actions.length?'<div class="detail-actions">'+actions.join('')+'</div>':'');
}

function buildSubtitle(s,e) {
  if(s==='psy'||s==='med') return (e.type||'')+(e.genre?' · '+e.genre : e.spec?' · '+e.spec:'');
  if(s==='plo') return (e.type||'')+(e.orient?' · '+e.orient:'');
  if(s==='idl') return 'IDEL'+(e.cabinet?' — '+e.cabinet:'');
  if(s==='edu') return e.type||'Éducateur';
  if(s==='san') return (e.type||'')+(e.spec?' · '+e.spec:'');
  if(s==='rea') return e.type||'';
  return e.type||s.toUpperCase();
}

function buildGrid(s,e) {
  const f=(label,val)=>val?'<div class="detail-field"><label>'+label+'</label><p>'+val+'</p></div>':'';
  const ff=(label,val)=>val?'<div class="detail-field full"><label>'+label+'</label><p>'+val+'</p></div>':'';
  let rows='';
  if(s==='psy'||s==='med') rows+=f('Visio',e.visio)+f('Département',e.dpt)+ff('Adresse',e.adresse);
  if(s==='plo') rows+=f('Tarif',e.tarif)+f('Visio',e.visio)+f('Groupes',e.groupes)+f('Département',e.dpt)+ff('Adresse',e.adresse);
  if(s==='idl') rows+=f('Secteur',e.secteur)+f('Département',e.dpt)+ff('Adresse',e.adresse);
  if(s==='edu') rows+=f('Tarif',e.tarif)+f('Visio',e.visio)+f('Groupes',e.groupes)+f('Département',e.dpt)+ff('Adresse',e.adresse);
  if(s==='heb') rows+=f('Public',e.population)+f('Âge',e.age)+f('Ouverture',e.annee)+f('Places perm.',e.placeP)+f('Places temp.',e.placeAT)+ff('Adresse',e.adresse);
  if(s==='sam') rows+=f('Type',e.type)+f('Capacité',e.capacite)+f('Âge',e.age)+f('Modalité',e.modalite)+ff('Adresse',e.adresse);
  if(s==='emp') rows+=f('Type',e.type)+f('Public',e.population)+f('Capacité',e.capacite)+f('Ouverture',e.annee)+ff('Adresse',e.adresse);
  if(s==='rea') rows+=f('Type',e.type)+f('Public',e.public_)+ff('Prestations',e.prestations)+ff('Adresse',e.adresse);
  if(s==='san') rows+=f('Territoire',e.territoire)+f('Mobile',e.mobile?'Oui':'Non')+ff('Modalité d\'accès',e.modalite)+ff('Adresse',e.adresse);
  if(s==='aso') rows+=f('Année de création',e.annee)+f('Département',e.dpt)+f('Domaine',e.domaine)+ff('Adresse',e.adresse);
  return rows;
}

function buildPills(s,e,c) {
  const pills=[];
  const pill=(label,bg)=>'<span class="pill" style="background:'+bg+'">'+label+'</span>';
  if(s==='psy'){ if(e.tsa)pills.push(pill('🧩 TSA','#2e7fc1')); if(e.tdah)pills.push(pill('⚡ TDAH','#c87e3a')); if(e.di)pills.push(pill('🧩 DI','#5a9972')); if(e.tca)pills.push(pill('🍽️ TCA','#c1607a')); if(e.sexo)pills.push(pill('❤️ Sexologie','#c1607a')); if(e.dpl)pills.push(pill('🏥 DPL','#2e7fc1')); if(e.m37)pills.push(pill('📋 M37','#5a7a3a')); if(e.borderline)pills.push(pill('🔹 Borderline','#7a5aa8')); }
  if(s==='med'){ if(e.tsa)pills.push(pill('🧩 TSA','#2e7fc1')); if(e.tdah)pills.push(pill('⚡ TDAH','#c87e3a')); }
  if(s==='plo'){ if(e.di)pills.push(pill('🧩 DI','#5a9972')); if(e.tdah)pills.push(pill('⚡ TDAH','#c87e3a')); if(e.hpi)pills.push(pill('✨ HPI','#d4a800')); if(e.tca)pills.push(pill('🍽️ TCA','#c1607a')); if(e.sexo)pills.push(pill('❤️ Sexologie','#c1607a')); if(e.hab)pills.push(pill('🤝 Hab.Soc.','#3a7a3a')); if(e.m37)pills.push(pill('📋 M37','#5a7a3a')); }
  if(s==='edu'){ if(e.tdah)pills.push(pill('⚡ TDAH','#c87e3a')); if(e.hpi)pills.push(pill('✨ HPI','#d4a800')); if(e.di)pills.push(pill('🧩 DI','#5a9972')); if(e.hab)pills.push(pill('🤝 Hab.Soc.','#3a7a3a')); if(e.visio&&e.visio.toLowerCase()==='oui')pills.push(pill('💻 Visio','#2e7fc1')); if(e.groupes&&e.groupes.toLowerCase()==='oui')pills.push(pill('👥 Groupes','#8a5a2e')); }
  if(s==='heb'){ if(hasVal(e.tsa))pills.push(pill('🧩 TSA/TED','#c1607a')); if(e.snoezelen&&e.snoezelen.toLowerCase()==='oui')pills.push(pill('💆 Snoezelen','#7a5aa8')); }
  if(s==='san'){ if(e.tsa)pills.push(pill('🧩 TSA/TED','#c1607a')); if(e.mobile)pills.push(pill('🚗 Mobile','#3a7a3a')); }
  if(s==='sam'||s==='rea'||s==='emp'){ if(e.tsa)pills.push(pill('🧩 TSA/TED','#c1607a')); }
  return pills;
}

// ══════════════════════════════════════════
// ZONE SEARCH
// ══════════════════════════════════════════
const zoneMarkers={};
const defaultViews=['psy','med','plo','idl','edu','heb','sam','emp','rea','san','aso'];
let zoneTimeout=null;

function getMap(id){ return MAPS[id]; }

async function onZoneInput(id) {
  const val=document.getElementById('zone-'+id).value.trim();
  const cl=document.getElementById('zone-clear-'+id);
  const sugg=document.getElementById('zone-sugg-'+id);
  if(cl) cl.style.display=val?'block':'none';
  if(val.length<2){if(sugg)sugg.style.display='none';return;}
  clearTimeout(zoneTimeout);
  zoneTimeout=setTimeout(()=>fetchSugg(id,val),300);
}
async function fetchSugg(id,val){
  const sugg=document.getElementById('zone-sugg-'+id); if(!sugg) return;
  try{
    const url='https://photon.komoot.io/api/?q='+encodeURIComponent(val)+'&limit=5&lang=fr&lat=43.5&lon=5.5';
    const res=await fetch(url); const data=await res.json();
    if(!data.features||!data.features.length){sugg.style.display='none';return;}
    sugg.innerHTML=data.features.map(f=>{
      const p=f.properties;
      const seen=new Set();
      const label=[p.name,p.housenumber&&p.street?p.housenumber+' '+p.street:p.street,p.postcode,p.city||p.town||p.village].filter(x=>x&&!seen.has(x)&&seen.add(x)).slice(0,4).join(', ');
      const ico=p.type==='city'||p.type==='town'?'🏙️':'📍';
      const lat=f.geometry.coordinates[1],lng=f.geometry.coordinates[0];
      return '<div class="zone-suggestion" onclick="applyZone(\''+id+'\','+lat+','+lng+',\''+label.replace(/'/g,"\\'")+'\')">'+(ico+' '+label)+'</div>';
    }).join('');
    sugg.style.display='block';
  }catch(e){if(sugg)sugg.style.display='none';}
}
async function searchZone(id){
  const val=document.getElementById('zone-'+id).value.trim();
  const sugg=document.getElementById('zone-sugg-'+id); if(sugg) sugg.style.display='none';
  if(!val){clearZone(id);return;}
  try{
    const res=await fetch('https://photon.komoot.io/api/?q='+encodeURIComponent(val)+'&limit=1&lang=fr&lat=43.5&lon=5.5');
    const data=await res.json();
    if(data.features&&data.features.length){const f=data.features[0];const p=f.properties;applyZone(id,f.geometry.coordinates[1],f.geometry.coordinates[0],[p.name,p.city||p.town].filter(Boolean).join(', '));}
  }catch(e){}
}
function applyZone(id,lat,lng,label){
  const map=getMap(id); if(!map) return;
  const sugg=document.getElementById('zone-sugg-'+id); if(sugg) sugg.style.display='none';
  const cl=document.getElementById('zone-clear-'+id); if(cl) cl.style.display='block';
  if(zoneMarkers[id]) map.removeLayer(zoneMarkers[id]);
  const icon=L.divIcon({html:'<div class="zone-marker-icon"></div>',className:'',iconSize:[16,16],iconAnchor:[8,8]});
  zoneMarkers[id]=L.marker([parseFloat(lat),parseFloat(lng)],{icon,zIndexOffset:1000})
    .bindTooltip(label,{permanent:false,direction:'top',offset:[0,-10]}).addTo(map);
  map.flyTo([parseFloat(lat),parseFloat(lng)],13,{duration:.8});
}
function clearZone(id){
  const map=getMap(id);
  const input=document.getElementById('zone-'+id); if(input) input.value='';
  const cl=document.getElementById('zone-clear-'+id); if(cl) cl.style.display='none';
  const sugg=document.getElementById('zone-sugg-'+id); if(sugg) sugg.style.display='none';
  if(zoneMarkers[id]&&map){map.removeLayer(zoneMarkers[id]);zoneMarkers[id]=null;}
  if(map) map.flyTo(DEFAULT_VIEW.center,DEFAULT_VIEW.zoom,{duration:.8});
}
document.addEventListener('click',e=>{
  ['psy','med','plo','idl','edu','heb','sam','emp','rea','san','aso'].forEach(id=>{
    const sugg=document.getElementById('zone-sugg-'+id);
    const inp=document.getElementById('zone-'+id);
    if(sugg&&!sugg.contains(e.target)&&e.target!==inp) sugg.style.display='none';
  });
});
